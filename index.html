<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather API</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header"></div>
      <div class="search-box">
        <input
          type="text"
          placeholder="Enter Your Location"
          class="input-box"
        />
        <button id="searchBtn" aria-label="Search location" >
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
      </div>
      <div class="weather-body">
        <img src="assets/cloud.png" alt="Weather" class="weather-img" />
        <div class="weather-box">
          <p class="temprature">0 <sup>°C</sup></p>
          <div class="description">Light Rain</div>
          <div class="weather-details">
            <div class="humidity">
              <i class="fa-solid fa-droplet"></i>
              <div class="text">
                <span id="humidity">45%</span>
                <p>humidity</p>
              </div>
            </div>
            <div class="wind-speed">
              <i class="fa-solid fa-wind"></i>
              <div class="text">
                <span id="wind-speed">12KM/h%</span>
                <p>wind Speed</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://kit.fontawesome.com/d437b3b346.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
